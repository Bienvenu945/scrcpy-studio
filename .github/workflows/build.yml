name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m unittest discover -s tests -t .

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --clean packaging/scrcpy_studio.spec
      - run: choco install innosetup -y --no-progress
      - run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\installer.iss'
      - run: Compress-Archive -Path dist\ScrcpyStudio -DestinationPath dist\ScrcpyStudio-windows-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: scrcpy-studio-windows
          path: |
            dist/ScrcpyStudio-setup.exe
            dist/ScrcpyStudio-windows-portable.zip

  deb:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: packaging/build_deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: scrcpy-studio-deb
          path: dist/*.deb
